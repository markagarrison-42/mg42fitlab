<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitLog">
  <meta name="theme-color" content="#0a0c0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <title>FitLog</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      background: #0a0c0f;
      color: #f1f5f9;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      /* Prevent iOS from scrolling body when keyboard opens */
      position: fixed;
      overflow-y: scroll;
    }
    #root {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    input, select, button, textarea {
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
    }
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    select { background-image: none; }
    ::-webkit-scrollbar { display: none; }
    * { -webkit-tap-highlight-color: transparent; }
  </style>
  <script async src="https://cdn.mosa.click/v1/mosa.js" data-site-id="0faf612a-dd5e-4948-a177-477fdfc6157e"></script>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="text/babel" src="{{ url_for('static', filename='ppl-tracker.js') }}"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // One-time purge of the old cache-first worker, which could serve stale
      // app code indefinitely and interfered with auth requests.
      if (!localStorage.getItem('sw_reset_v3')) {
        navigator.serviceWorker.getRegistrations().then(function(rs){
          return Promise.all(rs.map(function(r){ return r.unregister(); }));
        }).then(function(){
          return caches.keys().then(function(ks){
            return Promise.all(ks.map(function(k){ return caches.delete(k); }));
          });
        }).then(function(){
          localStorage.setItem('sw_reset_v3','1');
          location.reload();
        }).catch(function(){
          localStorage.setItem('sw_reset_v3','1');
        });
      } else {
        navigator.serviceWorker.register('/static/sw.js').catch(function(){});
      }
    }
  </script>
</body>
</html>
